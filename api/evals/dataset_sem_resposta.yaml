# Perguntas SEM resposta no corpus. Este arquivo é o instrumento que mede alucinação:
# a resposta certa para todas elas é a recusa.
#
# Duas famílias, medidas em SEPARADO — reportá-las juntas esconderia a primeira atrás
# da segunda:
#
#   ausente_no_dominio — plausível sobre consumidor / dados / responsabilidade, mas a
#     resposta não está nestas três leis. É o caso PERIGOSO: a busca traz trechos de
#     score alto, sobre o tema certo, que não respondem a pergunta.
#   fora_do_dominio    — sem relação nenhuma com o corpus. Caso fácil; serve de piso.
#
# Ao acrescentar pergunta: confirme que a resposta REALMENTE não está no corpus antes
# de anotar. Uma pergunta respondível aqui conta recusa correta como erro e derruba a
# métrica sem que nada esteja errado.
#
# Cada pergunta de ausente_no_dominio foi verificada por grep no corpus antes de entrar
# aqui — termo por termo, trecho por trecho — e o resultado está registrado no
# README.md desta pasta, seção "Como as perguntas sem resposta foram verificadas". Uma
# pergunta trocada nessa verificação (sobre arrependimento em compra feita em loja
# física) está documentada lá: o Art. 49 do CDC responde por exclusão ("fora do
# estabelecimento comercial"), o que a desqualificava.

